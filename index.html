<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
}


.dashboard-container {

    background:#f2f2f2;
    padding:30px;
    border-radius:12px;

}


.dashboard-container h1 {

    text-align:center;
    margin-bottom:30px;

}


.cards {

    display:flex;
    gap:20px;
    margin-bottom:40px;

}


.card {

    background:white;
    flex:1;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);

}


.card h3 {

    margin-top:0;

}


.value {

    font-size:48px;
    font-weight:bold;

}



.charts {

    display:flex;
    gap:30px;

}


.chart-box {

    background:white;
    padding:25px;
    border-radius:12px;
    flex:1;

}


.chart-box h2 {

    text-align:center;

}


canvas {

    max-height:400px;

}



.last-update {

    text-align:center;
    margin-top:20px;
    color:#666;

}



@media(max-width:800px){

    .cards,
    .charts {

        flex-direction:column;

    }

}


</style>



<div class="dashboard-container">


<h1>
DDD:Mining<br>
The Bench Challenge Dashboard
</h1>




<div class="cards">


<div class="card">

<h3>
Gold Beads at ROM
</h3>

<div class="value" id="goldROM">
0
</div>

</div>




<div class="card">

<h3>
Rock Beads at ROM
</h3>

<div class="value" id="rockROM">
0
</div>

</div>




<div class="card">

<h3>
Gold Beads in Waste
</h3>

<div class="value" id="goldWaste">
0
</div>

</div>


</div>





<div class="charts">


<div class="chart-box">

<h2>
ROM Pad
</h2>

<canvas id="romChart"></canvas>

</div>




<div class="chart-box">

<h2>
Waste Pile
</h2>

<canvas id="wasteChart"></canvas>

</div>


</div>




<div class="last-update" id="updated">
Connecting to live data...
</div>



</div>





<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbwkNeBP4v8iZ84WBarUCLz2Pyen72opWdGCEAncXeD8P4AT9LdbT_GlgsXidm-qQbRCVg/exec";



let romChart = null;

let wasteChart = null;




async function loadDashboard(){


try {


const response = await fetch(API_URL);


const data = await response.json();



// Update summary cards

document.getElementById("goldROM").innerHTML =
data.goldROM;


document.getElementById("rockROM").innerHTML =
data.rockROM;


document.getElementById("goldWaste").innerHTML =
data.goldWaste;



updateCharts(data);



document.getElementById("updated").innerHTML =
"Live update: " + new Date().toLocaleTimeString();



}

catch(error){


console.log(error);


document.getElementById("updated").innerHTML =
"Unable to load live data";


}


}







function updateCharts(data){



if(romChart){

romChart.destroy();

}



if(wasteChart){

wasteChart.destroy();

}




// ROM PAD CHART


romChart = new Chart(

document.getElementById("romChart"),

{


type:"bar",


data:{


labels:Object.keys(data.romTeams),


datasets:[

{

label:"Gold",

data:Object.values(data.romTeams)
.map(team=>team.gold)

},


{

label:"Rock",

data:Object.values(data.romTeams)
.map(team=>team.rock)

}

]


},



options:{


responsive:true,


plugins:{

legend:{

position:"bottom"

}

},


scales:{

y:{

beginAtZero:true

}

}


}


}

);







// WASTE PILE CHART


wasteChart = new Chart(

document.getElementById("wasteChart"),

{


type:"bar",


data:{


labels:Object.keys(data.wasteTeams),


datasets:[

{

label:"Gold",

data:Object.values(data.wasteTeams)
.map(team=>team.gold)

},


{

label:"Rock",

data:Object.values(data.wasteTeams)
.map(team=>team.rock)

}

]


},



options:{


responsive:true,


plugins:{

legend:{

position:"bottom"

}

},


scales:{

y:{

beginAtZero:true

}

}


}


}

);


}







// Initial load

loadDashboard();


// Refresh every 5 seconds

setInterval(loadDashboard,5000);



</script>
