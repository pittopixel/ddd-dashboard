<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    font-family: Arial, sans-serif;
    background:#1c1c1c;
    margin:0;
    padding:0;
}


.dashboard-container {

    background:#1c1c1c;
    padding:30px;
    min-height:100vh;

}



/* HEADER */

.dashboard-header {

    background:
    linear-gradient(135deg,#2b2b2b,#111111);

    border-left:10px solid #CE7D01;

    padding:30px;

    border-radius:15px;

    margin-bottom:35px;

    box-shadow:0 5px 15px rgba(0,0,0,0.5);

}



.dashboard-title {

    font-size:52px;

    font-weight:bold;

    color:#CE7D01;

    text-align:center;

    margin:0;

}



.subtitle {

    text-align:center;

    color:white;

    font-size:20px;

    margin-top:15px;

}





/* KPI CARDS */


.cards {

    display:flex;

    gap:20px;

    margin-bottom:30px;

}



.card {

    background:#2b2b2b;

    flex:1;

    padding:25px;

    border-radius:15px;

    text-align:center;

    color:white;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.5);

}



.gold-card {

    border:4px solid #00FF00;

}



.rock-card {

    border:4px solid #FF8C00;

}



.waste-card {

    border:4px solid #FF0000;

}



.card h3 {

    color:#dddddd;

    font-size:20px;

}



.value {

    font-size:60px;

    font-weight:bold;

    color:#CE7D01;

}





/* OPERATION METRICS */


.metrics {

    display:flex;

    gap:20px;

    margin-bottom:40px;

}



.metric {

    background:#252525;

    flex:1;

    padding:20px;

    border-radius:15px;

    text-align:center;

    color:white;

    border-left:5px solid #CE7D01;

}



.metric-title {

    font-size:18px;

    color:#cccccc;

}



.metric-value {

    font-size:36px;

    font-weight:bold;

    color:#CE7D01;

}





/* CHARTS */


.charts {

    display:flex;

    gap:30px;

}



.chart-box {

    background:#2b2b2b;

    padding:25px;

    border-radius:15px;

    flex:1;

}



.chart-box h2 {

    text-align:center;

    color:white;

}



canvas {

    max-height:400px;

}



.last-update {

    text-align:center;

    color:#aaa;

    margin-top:25px;

}



@media(max-width:800px){

.cards,
.metrics,
.charts {

flex-direction:column;

}

}


</style>





<div class="dashboard-container">



<div class="dashboard-header">


<h1 class="dashboard-title">

⛏ Drill Down Day:
<br>
Mining The Bench Challenge Dashboard

</h1>


<div class="subtitle">

Live Mine Production Monitoring System

</div>


</div>





<!-- MAIN KPI CARDS -->


<div class="cards">


<div class="card gold-card">

<h3>
Gold Beads at ROM
</h3>

<div class="value" id="goldROM">
0
</div>

</div>





<div class="card rock-card">

<h3>
Rock Beads at ROM
</h3>

<div class="value" id="rockROM">
0
</div>

</div>





<div class="card waste-card">

<h3>
Gold Beads in Waste
</h3>

<div class="value" id="goldWaste">
0
</div>

</div>


</div>





<!-- OPERATION METRICS -->


<div class="metrics">


<div class="metric">

<div class="metric-title">
⛏ Total Material Moved
</div>

<div class="metric-value" id="materialMoved">
0
</div>

</div>




<div class="metric">

<div class="metric-title">
🟡 Gold Recovery
</div>

<div class="metric-value" id="goldRecovery">
0%
</div>

</div>




<div class="metric">

<div class="metric-title">
⚠️ Waste Contamination
</div>

<div class="metric-value" id="contamination">
0%
</div>

</div>



</div>





<div class="charts">


<div class="chart-box">

<h2>
⛏ ROM Pad
</h2>

<canvas id="romChart"></canvas>

</div>




<div class="chart-box">

<h2>
● Waste Pile
</h2>

<canvas id="wasteChart"></canvas>

</div>


</div>





<div class="last-update" id="updated">

Connecting to live data...

</div>


</div>
<script>
console.log("Dashboard script loaded");

const API_URL =
"https://script.google.com/macros/s/AKfycbwkNeBP4v8iZ84WBarUCLz2Pyen72opWdGCEAncXeD8P4AT9LdbT_GlgsXidm-qQbRCVg/exec";



let romChart = null;

let wasteChart = null;





async function loadDashboard(){


try {


const response = await fetch(API_URL);


const data = await response.json();

console.log("API DATA:", data);


// Update KPI cards


document.getElementById("goldROM").innerHTML =
data.goldROM;


document.getElementById("rockROM").innerHTML =
data.rockROM;


document.getElementById("goldWaste").innerHTML =
data.goldWaste;





// Update operational metrics

updateMetrics(data);



// Update charts

updateCharts(data);





document.getElementById("updated").innerHTML =

"Live update: " + new Date().toLocaleTimeString();



}


catch(error){


console.log(error);


document.getElementById("updated").innerHTML =
"Unable to load live data";


}


}







function updateMetrics(data){



// Total material moved

const totalMaterial =
data.goldROM +
data.rockROM +
data.goldWaste;



document.getElementById("materialMoved").innerHTML =
totalMaterial;







// Gold Recovery %

const totalGold =
data.goldROM +
data.goldWaste;



let recovery = 0;



if(totalGold > 0){

recovery =
(data.goldROM / totalGold) * 100;

}



document.getElementById("goldRecovery").innerHTML =
recovery.toFixed(1) + "%";







// Waste contamination %

let contamination = 0;



if(totalGold > 0){

contamination =
(data.goldWaste / totalGold) * 100;

}



document.getElementById("contamination").innerHTML =
contamination.toFixed(1) + "%";



}









function updateCharts(data){



if(romChart){

romChart.destroy();

}



if(wasteChart){

wasteChart.destroy();

}








// ROM PAD CHART



romChart = new Chart(

document.getElementById("romChart"),

{


type:"bar",


data:{


labels:Object.keys(data.romTeams),


datasets:[


{

label:"Gold",

data:Object.values(data.romTeams)
.map(team=>team.gold),

backgroundColor:"#CE7D01",

borderWidth:0,

borderRadius:8

},




{

label:"Rock",

data:Object.values(data.romTeams)
.map(team=>team.rock),

backgroundColor:"#C2A878",

borderWidth:0,

borderRadius:8

}


]


},





options:{


responsive:true,


plugins:{


legend:{


position:"bottom",


labels:{


color:"white"


}


}



},





scales:{



x:{


ticks:{


color:"white"


}


},




y:{


beginAtZero:true,


ticks:{


color:"white"


}


}



}}
);



// WASTE PILE CHART



wasteChart = new Chart(

document.getElementById("wasteChart"),

{


type:"bar",


data:{


labels:Object.keys(data.wasteTeams),


datasets:[


{

label:"Gold",

data:Object.values(data.wasteTeams)
.map(team=>team.gold),

backgroundColor:"#CE7D01",

borderWidth:0,

borderRadius:8

},





{

label:"Rock",

data:Object.values(data.wasteTeams)
.map(team=>team.rock),

backgroundColor:"#C2A878",

borderWidth:0,

borderRadius:8

}


]


},





options:{


responsive:true,


plugins:{


legend:{


position:"bottom",


labels:{


color:"white"


}


}



},





scales:{



x:{


ticks:{


color:"white"


}


},




y:{


beginAtZero:true,


ticks:{


color:"white"


}


}



}


}


);



}




// Initial load

loadDashboard();



// Refresh every 5 seconds

setInterval(loadDashboard,5000);



</script>
