<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mining The Bench Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#1c1c1c;margin:0;color:#fff}
.dashboard-container{padding:30px}
.dashboard-header{background:linear-gradient(135deg,#2b2b2b,#111);border-left:10px solid #CE7D01;padding:30px;border-radius:15px;margin-bottom:35px}
.dashboard-title{font-size:52px;font-weight:bold;color:#CE7D01;text-align:center;margin:0}
.subtitle{text-align:center;color:#fff;font-size:20px;margin-top:15px}
.cards,.metrics,.charts{display:flex;gap:20px;margin-bottom:30px}
.card,.metric,.chart-box{background:#2b2b2b;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.5);padding:25px;flex:1;text-align:center}
.gold-card{border:4px solid #00ff00}.rock-card{border:4px solid #ff8c00}.waste-card{border:4px solid #ff0000}
.card h3{font-size:30px;color:#ddd}.value{font-size:60px;font-weight:bold;color:#CE7D01}
.metric{border-left:5px solid #CE7D01;background:#252525}
.metric-title{font-size:18px;color:#ccc}.metric-value{font-size:36px;font-weight:bold;color:#CE7D01}
.chart-box h2{margin-top:0}canvas{max-height:400px}.last-update{text-align:center;color:#aaa}
@media(max-width:800px){.cards,.metrics,.charts{flex-direction:column}}
</style>
</head>
<body>
<div class="dashboard-container">
<div class="dashboard-header">
<h1 class="dashboard-title">⛏ Drill Down Day<br>Mining The Bench Challenge Dashboard</h1>
<div class="subtitle">Live Mine Production Monitoring System</div></div>
<div class="cards">
<div class="card gold-card"><h3>Gold Beads at ROM</h3><div class="value" id="goldROM">0</div></div>
<div class="card rock-card"><h3>Rock Beads at ROM</h3><div class="value" id="rockROM">0</div></div>
<div class="card waste-card"><h3>Gold Beads in Waste</h3><div class="value" id="goldWaste">0</div></div>
</div>
<div class="metrics">
<div class="metric"><div class="metric-title">⛏ Total Material Moved</div><div class="metric-value" id="materialMoved">0</div></div>
<div class="metric"><div class="metric-title">🟡 Gold Recovery</div><div class="metric-value" id="goldRecovery">0%</div></div>
<div class="metric"><div class="metric-title">⚠️ Waste Contamination</div><div class="metric-value" id="contamination">0%</div></div>
</div>
<div class="charts">
<div class="chart-box"><h2>⛏ ROM Pad</h2><canvas id="romChart"></canvas></div>
<div class="chart-box"><h2>● Waste Pile</h2><canvas id="wasteChart"></canvas></div>
</div>
<div class="last-update" id="updated">Connecting...</div>
</div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwkNeBP4v8iZ84WBarUCLz2Pyen72opWdGCEAncXeD8P4AT9LdbT_GlgsXidm-qQbRCVg/exec";
let romChart,wasteChart;
async function loadDashboard(){
 try{
  const data=await (await fetch(API_URL)).json();
  goldROM.textContent=data.goldROM;rockROM.textContent=data.rockROM;goldWaste.textContent=data.goldWaste;
  const total=data.goldROM+data.rockROM+data.goldWaste;
  materialMoved.textContent=total;
  const tg=data.goldROM+data.goldWaste;
  goldRecovery.textContent=(tg?data.goldROM/tg*100:0).toFixed(1)+"%";
  contamination.textContent=(tg?data.goldWaste/tg*100:0).toFixed(1)+"%";
  updateCharts(data);
  updated.textContent="Live update: "+new Date().toLocaleTimeString();
 }catch(e){updated.textContent="Unable to load live data";console.error(e);}
}
function makeChart(canvas,title,dataObj){
 return new Chart(canvas,{type:"bar",
 data:{labels:Object.keys(dataObj),
 datasets:[
 {label:"Gold",data:Object.values(dataObj).map(t=>t.gold),backgroundColor:"#CE7D01",borderWidth:0,borderRadius:8},
 {label:"Rock",data:Object.values(dataObj).map(t=>t.rock),backgroundColor:"#C2A878",borderWidth:0,borderRadius:8}
 ]},
 options:{responsive:true,plugins:{legend:{position:"bottom",labels:{color:"white"}}},
 scales:{x:{ticks:{color:"white"}},y:{beginAtZero:true,ticks:{color:"white"}}}}
 });
}
function updateCharts(data){
 if(romChart)romChart.destroy();
 if(wasteChart)wasteChart.destroy();
 romChart=makeChart(document.getElementById("romChart"),"ROM",data.romTeams);
 wasteChart=makeChart(document.getElementById("wasteChart"),"Waste",data.wasteTeams);
}
loadDashboard();setInterval(loadDashboard,5000);
</script>
</body></html>
